name: Flutter verify

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format changed Dart files
        run: >-
          dart format
          lib/ui/screens/home/home_screen.dart
          lib/ui/screens/home/widgets/category_card.dart
          lib/ui/screens/home/widgets/header_card.dart
          lib/ui/screens/home/widgets/home_location_widget.dart
          lib/ui/screens/home/widgets/home_search.dart
          lib/ui/screens/home/widgets/property_card_big.dart
          lib/ui/screens/home/widgets/property_horizontal_card.dart
          lib/ui/screens/home/widgets/sections/all_properties_section.dart
          lib/ui/screens/home/widgets/sections/categories_section.dart
          lib/ui/screens/home/widgets/sections/slider_section.dart
          lib/ui/screens/profile/profile_screen.dart
          lib/ui/screens/profile/profile_settings/profile_header.dart
          lib/ui/screens/profile/profile_settings/agent_status_card.dart
          lib/ui/screens/profile/profile_settings/profile_menu.dart
          lib/ui/screens/profile/profile_settings/profile_tile.dart
          lib/ui/screens/profile/profile_settings/user_verification_card.dart
          lib/ui/screens/profile/widgets/profile_body.dart
          lib/ui/screens/main_activity.dart
          lib/ui/screens/agent_dashboard/widgets/agent_bottom_bar.dart
          lib/ui/screens/widgets/add_listing_button.dart
          lib/ui/screens/widgets/premium_bottom_bar.dart
          lib/ui/screens/subscription/packages_list.dart
          lib/ui/screens/subscription/widget/package_tile.dart
          lib/ui/screens/subscription/widget/my_packages_tile.dart
          lib/utils/custom_tabbar.dart
          lib/ui/screens/auth/login_screen.dart
          lib/ui/screens/chat/chat_list_screen.dart
          lib/ui/screens/chat/widgets/chat_input_bar.dart
          lib/ui/screens/filter_screen.dart
          lib/ui/screens/my_listings_screen.dart
          lib/ui/screens/onboarding/onboarding_screen.dart
          lib/ui/screens/proprties/property_details/widgets/property_description_section.dart
          lib/ui/screens/proprties/property_details/widgets/property_header.dart
          lib/ui/screens/proprties/property_details/widgets/property_image_carousel.dart
          lib/ui/screens/proprties/property_details/widgets/property_owner_bottom_bar.dart

      - name: Analyze application
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests when present
        shell: bash
        run: |
          if find test -type f -name '*_test.dart' -print -quit 2>/dev/null | grep -q .; then
            flutter test
          else
            echo 'No Flutter tests found; skipping flutter test.'
          fi

      - name: Install required Android NDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=3 'ndk;29.0.14033849'

      - name: Build debug APK
        run: flutter build apk --debug
